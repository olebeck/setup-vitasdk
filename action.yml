name: 'Install VitaSDK'
description: 'Installs VitaSDK using the bootstrap script with an optional commit hash, sets paths, and installs packages.'
inputs:
  channel:
    description: 'Release series to install (e.g., 2026.08, nightly, nightly-softfp)'
    required: false
    default: ''
  packages:
    description: 'Space-separated list of vdpm packages to install (e.g., taihen sdl2)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Download and run VitaSDK bootstrap script
      shell: bash
      env:
        VITASDK_CHANNEL: ${{ inputs.channel }}
      run: |
        URL="https://raw.githubusercontent.com/vitasdk/vdpm/e55fa5eee3ebb889d7fff8a800ecd48a9e92fa86/bootstrap-vitasdk.sh"
        echo "Downloading bootstrap script from: $URL"
        if [ -n "$VITASDK_CHANNEL" ]; then
          echo "Targeting channel: $VITASDK_CHANNEL"
        fi
        curl -sSL "$URL" | sudo bash
        sudo chown -R $USER:$USER /usr/local/vitasdk
        echo "VITASDK=/usr/local/vitasdk" >> "$GITHUB_ENV"
        echo "/usr/local/vitasdk/bin" >> "$GITHUB_PATH"

    - name: install packages
      if: ${{ inputs.packages }}
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        vdpm pacman -S $PACKAGES --noconfirm
